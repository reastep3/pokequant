# Local parity stack (needs Docker): TimescaleDB + Redis + API + worker + web.
# Without Docker, `make dev` runs the API on SQLite and the web app with `npm run dev`.
services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: pokequant
      POSTGRES_USER: pokequant
      POSTGRES_PASSWORD: pokequant
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U pokequant"], interval: 5s, retries: 20 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgresql+asyncpg://pokequant:pokequant@db:5432/pokequant
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000
      API_KEY: dev-key
    command: sh -c "alembic upgrade head && python -m app.serve"
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgresql+asyncpg://pokequant:pokequant@db:5432/pokequant
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    command: python -m app.workers
    depends_on: [api]
  web:
    build: { context: ., target: web, args: { NEXT_PUBLIC_API_URL: http://localhost:8000 } }
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
